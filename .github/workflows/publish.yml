# Publish a tagged release to npm with Trusted Publishing (OIDC + provenance).
#
# One-time npm setup (package owner, needs account 2FA) — either the CLI:
#
#   npm login
#   npm trust github @zephinel/dsh-intelligent-ui --file publish.yml \
#     --repo Zephinel/dsh-intelligent-ui --allow-publish --yes
#
# or npmjs.com → the package → Settings → Trusted Publishing → GitHub Actions
# (repository Zephinel/dsh-intelligent-ui, workflow publish.yml).
#
# Release: bump the version and update the docs (keep the CHANGELOG section),
# commit, then push a matching tag:
#
#   git tag v0.5.0
#   git push origin v0.5.0
#
# The job fails if the tag does not match package.json, if `npm run check` or
# `npm run pack:check` fails, if CHANGELOG.md has no section for the version, or
# if `release-notes/<version>.md` has no reviewed Highlights bullets, so a
# mistyped, undocumented or un-reviewed tag cannot publish. `check:release` (install the
# tarball into a throwaway DSH_HOME and serve it) is still a local pre-release
# gate: wire it in here only after its Linux runner behaviour is verified.
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
          echo "publishing ${version}"

      - name: Install dependencies
        run: npm ci

      - name: Local gate
        run: npm run check

      - name: Packaged manifest
        run: npm run pack:check

      - name: Release notes exist for this version
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [${version}]\" section"
            exit 1
          fi
          echo "changelog section ok: ${version}"

      - name: Reviewed release notes exist for this version
        # The update card reads these Highlights from the tag-pinned raw file;
        # the file must be reviewed and committed before the tag is pushed.
        run: npm run check:release-notes

      - name: Publish with provenance
        run: npm publish --access public --tag latest --provenance

      - name: Verify the published version and dist-tag
        # Registry propagation can take several minutes (0.6.0 took ~7 min to
        # appear through the packument even though `npm publish` succeeded).
        # Poll the cheap dist-tags/version endpoints directly with a long bound
        # instead of trusting a cached `npm view` for a few seconds.
        run: |
          version="$(node -p "require('./package.json').version")"
          encoded="$(node -p "require('./package.json').name.replace('/', '%2F')")"
          for attempt in $(seq 1 60); do
            tags="$(curl -fsS --max-time 10 "https://registry.npmjs.org/-/package/${encoded}/dist-tags" 2>/dev/null || true)"
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://registry.npmjs.org/${encoded}/${version}" 2>/dev/null || true)"
            if [ "$status" = "200" ] && printf '%s' "$tags" | grep -Fq "\"latest\":\"${version}\""; then
              echo "registry: ${version} (latest; version endpoint 200)"
              exit 0
            fi
            echo "registry not settled yet (version endpoint ${status:-none}; tags: ${tags:-none}); retrying"
            sleep 10
          done
          echo "::error::registry verification failed after 10 minutes: expected ${version}; last tags=${tags:-none} status=${status:-none}"
          exit 1
